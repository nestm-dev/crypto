version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      cloud-kms:
        patterns:
          - "@aws-sdk/*"
          - "@google-cloud/*"
          - "@azure/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
