packages:
  - "."

# These packages do not need lifecycle builds in this workspace.
allowBuilds:
  "@nestjs/core": false
  "@swc/core": false
  "esbuild": false
  protobufjs: false

# A failed OIDC attestation must fail a release.
provenance: true

minimumReleaseAgeExclude:
  - "@nestm/tenant@0.1.0-alpha.8"
  - "@aws-sdk/client-kms@3.1120.0"
  - "@nestjs/common@12.0.1"
  - "@nestjs/core@12.0.1"
  - "@nestjs/testing@12.0.1"
  - "@types/node@26.4.0"
